name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['**.ps1', '**.psm1', '**.psd1', 'config/**', 'tests/**', '.github/workflows/lint.yml']

permissions:
  contents: read

jobs:
  lint:
    name: Lint PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings @{
            Rules = @{
              PSAvoidUsingCmdletAliases = @{ Enable = $true }
              PSAvoidUsingWriteHost = @{ Enable = $false }
            }
            ExcludeRules = @(
              'PSAvoidUsingWriteHost',
              'PSAvoidUsingInvokeExpression',
              'PSUseShouldProcessForStateChangingFunctions',
              'PSUseSingularNouns',
              'PSUseDeclaredVarsMoreThanAssignments',
              'PSAvoidUsingPositionalParameters',
              'PSAvoidOverwritingBuiltInCmdlets',
              'PSUseBOMForUnicodeEncodedFile',
              'PSAvoidUsingEmptyCatchBlock',
              'PSUseApprovedVerbs',
              'PSUseUsingScopeModifierInNewRunspaces',
              'PSReviewUnusedParameter'
            )
          }

          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          } else {
            Write-Host "No issues found." -ForegroundColor Green
          }

  test:
    name: Run Pester Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0

      - name: Run Pester Tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './testresults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./testresults.xml

  release:
    name: Publish Winrift Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish untagged version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -er '.version | strings' config/version.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi

          tag="v$version"
          existing_tag=$(git ls-remote --refs origin "refs/tags/$tag")
          if [[ -n "$existing_tag" ]]; then
            echo "$tag already exists. Skipping release."
            exit 0
          fi

          # A later push may have finished its checks before this run.
          main=$(git ls-remote --refs origin refs/heads/main)
          if [[ "${main%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "main moved since this run started. Skipping release."
            exit 0
          fi

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes
